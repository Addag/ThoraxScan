<!doctype html>
<html>
<body style="margin:0;padding:0;background:#030b1d;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#030b1d" style="background:#030b1d;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
<tr><td align="center">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
    <tr><td style="padding:0 0 20px;font-size:22px;font-weight:bold;color:#fafafa;">Thorax<span style="color:#51b6ff;">Scan</span></td></tr>
    <tr><td bgcolor="#010d2a" style="background:#010d2a;border:1px solid #33425c;border-radius:12px;padding:32px;">
      <h1 style="margin:0 0 12px;font-size:20px;color:#fafafa;">Reset your password</h1>
      <p style="margin:0 0 24px;font-size:15px;line-height:22px;color:#c7d4e8;">We got a request to reset the password for your ThoraxScan account. Use the button below to choose a new one.</p>
      <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#0077ff;color:#ffffff;text-decoration:none;font-size:15px;font-weight:bold;padding:12px 24px;border-radius:8px;">Reset password</a>
      <p style="margin:24px 0 0;font-size:13px;line-height:20px;color:#aebbd0;">If you didn't request this, you can ignore this email. Your password won't change.</p>
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
